name: Dart CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    # Runs at 02:00 UTC on the 1, 4, 7, 10, 13, 16, 19, 22, 25, 28 and 31st of every month.
    - cron: "0 2 */3 * *"
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        sdk: [ beta, stable, 3.0.0 ]

    steps:
      - uses: actions/checkout@v7

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1.8.1
        with:
          sdk: ${{ matrix.sdk }}

      - name: Print Dart version
        run: dart --version

      - name: Install dependencies
        run: dart pub get

      - name: Analyze
        if: ${{ matrix.sdk == 'stable' }}
        run: dart analyze lib --fatal-infos --fatal-warnings

      - name: Format code
        if: ${{ matrix.sdk == 'stable' }}
        run: dart format . --set-exit-if-changed

      - name: Run all tests
        if: ${{ matrix.sdk != 'stable' }}
        run: dart test --chain-stack-traces

      - name: Run all tests and collect coverage
        if: ${{ matrix.sdk == 'stable' }}
        run: dart test --coverage=./coverage --chain-stack-traces

      - name: Activate coverage
        if: ${{ matrix.sdk == 'stable' }}
        run: dart pub global activate coverage

      - name: Format coverage
        if: ${{ matrix.sdk == 'stable' }}
        run: >-
          dart pub global run coverage:format_coverage
          --report-on=lib
          --lcov
          --in=./coverage
          --out=./coverage/lcov.info

      - uses: codecov/codecov-action@v7.1.1
        if: ${{ matrix.sdk == 'stable' }}
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: true # optional (default = false)
          token: ${{ secrets.CODECOV_TOKEN }} # required
          verbose: true # optional (default = false)

  dependency-bounds:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1.8.1
        with:
          sdk: stable

      - name: Verify published dependency lower bounds as a consumer
        shell: bash
        run: |
          set -euo pipefail
          consumer_dir="$(mktemp -d)"
          mkdir -p "$consumer_dir/bin"
          sdk_constraint="$(sed -n 's/^  sdk: //p' "$GITHUB_WORKSPACE/pubspec.yaml")"
          if [[ -z "$sdk_constraint" ]]; then
            echo 'Could not read the SDK constraint from pubspec.yaml'
            exit 1
          fi
          cat > "$consumer_dir/pubspec.yaml" <<EOF
          name: dart_either_bounds_consumer
          environment:
            sdk: $sdk_constraint
          dependencies:
            dart_either:
              path: "$GITHUB_WORKSPACE"
          EOF
          cat > "$consumer_dir/bin/check.dart" <<'DART'
          import 'package:dart_either/dart_either.dart';

          void main() {
            final result = Either.sequence<String, int>([
              const Either<String, int>.right(1),
              const Either<String, int>.right(2),
            ]);
            if (!result.isRight) {
              throw StateError('Expected a Right result');
            }
          }
          DART
          cd "$consumer_dir"
          dart pub downgrade
          dart run bin/check.dart

  package-validation:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1.8.1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get --no-example

      - name: Validate API documentation links
        run: dart doc --validate-links

      - name: Validate published package contents
        run: dart pub publish --dry-run

      - name: Activate pana
        run: dart pub global activate pana

      - name: Analyze package quality with pana
        shell: bash
        run: |
          set -euo pipefail
          # Preserve the example's ../../dart_either path dependency in the copy.
          package_root="$(mktemp -d)/dart_either"
          mkdir -p "$package_root"
          git archive HEAD | tar -x -C "$package_root"
          pana_log="$RUNNER_TEMP/pana.log"
          if dart pub global run pana "$package_root" >"$pana_log" 2>&1; then
            result="$(sed -n '/^Points: /p' "$pana_log" | tail -n 1)"
            if [[ -n "$result" ]]; then
              printf '%s\n' "$result"
              printf '%s\n' "$result" >> "$GITHUB_STEP_SUMMARY"
            else
              echo 'pana completed without a points summary. Last 80 log lines:'
              tail -n 80 "$pana_log"
              exit 1
            fi
          else
            echo 'pana failed. Last 80 log lines:'
            tail -n 80 "$pana_log"
            exit 1
          fi
